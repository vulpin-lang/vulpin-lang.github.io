  <style>
    /* Base style for the line */
    .step-line {
      position: absolute;
      left: 25px;
      top: 50px;
      height: 100%;
      /* Full height of the container */
      max-height: calc(100% + 40px);
      /* Extend slightly to reach next circle */
      width: 3px;
      background-color: #e9ecef;
      z-index: -1;

      /* Animation Setup */
      transform-origin: top center;
      animation: rollLine 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      clip-path: inset(0 0 100% 0);
      /* Start hidden (clipped at bottom) */
    }

    /* The rolling/drawing animation */
    @keyframes rollLine {
      to {
        clip-path: inset(0 0 0 0);
        /* Reveal fully */
      }
    }

    /* Step content fade-in */
    .step-item {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered delays for the "rolling" sequence */
    .step-item:nth-child(1) .step-line {
      animation-delay: 0.1s;
    }

    .step-item:nth-child(2) .step-line {
      animation-delay: 0.6s;
    }

    .step-item:nth-child(1) {
      animation-delay: 0.1s;
    }

    .step-item:nth-child(2) {
      animation-delay: 0.6s;
    }

    .step-item:nth-child(3) {
      animation-delay: 1.1s;
    }

    /* Orange gradient for completed steps */
    .step-completed .step-line {
      background: linear-gradient(180deg, #ff8c00, #ffa500);
    }
  </style>

  <script>
    window.addEventListener('scroll', function () {
      const navbar = document.getElementById('mainNavbar');
      const brandText = document.querySelector('#navBrand span');

      if (window.scrollY > 50) {
        navbar.style.background = 'linear-gradient(135deg, #ff8c00, #ffa500)';
        navbar.style.padding = '0.5rem 0';
        navbar.style.margin = '0.5rem auto';
        navbar.style.width = '90%';
        navbar.style.maxWidth = '1200px';
        navbar.style.borderRadius = '15px';
        navbar.style.boxShadow = '0 4px 15px rgba(255, 140, 0, 0.3)';
        navbar.classList.add('navbar-scrolled'); // Triggers smaller logo via CSS

        if (brandText) { brandText.classList.add('text-white'); brandText.classList.remove('text-dark'); }
        document.querySelectorAll('.nav-link').forEach(link => {
          link.classList.remove('text-dark'); link.classList.add('text-white');
          link.style.background = 'rgba(255, 255, 255, 0.1)';
        });
        document.querySelector('.navbar-toggler-icon').style.filter = 'invert(1)';
      } else {
        navbar.style.background = 'transparent';
        navbar.style.padding = '1.5rem 0';
        navbar.style.margin = '0';
        navbar.style.width = '100%';
        navbar.style.maxWidth = '100%';
        navbar.style.borderRadius = '0';
        navbar.style.boxShadow = 'none';
        navbar.classList.remove('navbar-scrolled'); // Restores normal logo size

        if (brandText) { brandText.classList.remove('text-white'); brandText.classList.add('text-dark'); }
        document.querySelectorAll('.nav-link').forEach(link => {
          link.classList.remove('text-white'); link.classList.add('text-dark');
          link.style.background = 'transparent';
        });
        document.querySelector('.navbar-toggler-icon').style.filter = 'invert(0)';
      }
    });
  </script>
