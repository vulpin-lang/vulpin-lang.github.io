<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Vulpin the glass fox">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#dff3ff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#c8e9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7cc8ff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb057"/>
      <stop offset=".45" stop-color="#f0781f"/>
      <stop offset="1" stop-color="#cf5a12"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e86f1e"/>
      <stop offset="1" stop-color="#b24a08"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6c2"/>
    </linearGradient>
    <linearGradient id="creamShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6c2"/>
      <stop offset="1" stop-color="#ffc078"/>
    </linearGradient>
    <linearGradient id="blackTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#576684"/>
      <stop offset="1" stop-color="#0e2140"/>
    </linearGradient>
    <radialGradient id="shin" cx=".35" cy=".18" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo behind fox -->
  <circle cx="120" cy="106" r="86" fill="url(#shin)" opacity=".5"/>

  <!-- tail -->
  <path d="M150 120 C 186 108 214 88 216 66 C 217 58 210 56 204 62
           C 190 80 172 96 156 116 Z" fill="url(#fur)"/>
  <!-- tail dark tip -->
  <path d="M216 66 C 218 74 210 88 198 96 l-2 4 c 7 -10 12 -25 8 -34 z"
        fill="url(#blackTip)" opacity=".9"/>
  <!-- tail glass shine -->
  <path d="M160 112 C 182 102 200 88 208 76 C 196 90 176 102 158 112 Z"
        fill="url(#glass)" opacity=".7"/>

  <!-- body -->
  <rect x="84" y="88" width="76" height="74" fill="url(#fur)"/>
  <rect x="84" y="88" width="76" height="74" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <!-- body glass facet -->
  <path d="M88 92 h68 v16 q-10 -8 -34 -10 q-22 -2 -34 10 z" fill="url(#glass)" opacity=".9"/>
  <!-- body highlight splotch -->
  <ellipse cx="112" cy="108" rx="18" ry="10" fill="url(#shin)" opacity=".8"/>

  <!-- chest -->
  <rect x="96" y="120" width="50" height="44" fill="url(#cream)"/>
  <rect x="96" y="120" width="50" height="44" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>

  <!-- forepaw left -->
  <rect x="96" y="150" width="22" height="16" fill="url(#creamShade)"/>
  <rect x="96" y="150" width="22" height="16" fill="none" stroke="#d95f18" stroke-opacity=".4" stroke-width="2"/>
  <!-- forepaw right -->
  <rect x="126" y="150" width="22" height="16" fill="url(#creamShade)"/>
  <rect x="126" y="150" width="22" height="16" fill="none" stroke="#d95f18" stroke-opacity=".4" stroke-width="2"/>

  <!-- back paws -->
  <rect x="84" y="156" width="22" height="8" rx="2" fill="url(#furDark)"/>
  <rect x="136" y="156" width="22" height="8" rx="2" fill="url(#furDark)"/>

  <!-- head -->
  <rect x="76" y="34" width="92" height="70" rx="10" fill="url(#fur)"/>
  <rect x="76" y="34" width="92" height="70" rx="10" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2.5"/>

  <!-- head glass top -->
  <path d="M80 38 h84 v20 q-20 -14 -42 -15 q-26 -2 -42 15 z" fill="url(#glass)" opacity=".9"/>
  <!-- head sheen -->
  <ellipse cx="100" cy="52" rx="16" ry="7" fill="url(#shin)" opacity=".85"/>

  <!-- ears -->
  <path d="M80 40 L84 8 L100 38 Z" fill="url(#fur)"/>
  <path d="M80 40 L84 8 L100 38 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M166 40 L162 8 L146 38 Z" fill="url(#fur)"/>
  <path d="M166 40 L162 8 L146 38 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <!-- ear inner dark -->
  <path d="M86 38 L90 16 L98 36 Z" fill="url(#blackTip)" opacity=".92"/>
  <path d="M152 38 L150 16 L142 36 Z" fill="url(#blackTip)" opacity=".92"/>
  <!-- ear shine -->
  <path d="M92 30 L95 16 L100 30 Z" fill="url(#glass)" opacity=".8"/>

  <!-- muzzle -->
  <rect x="88" y="74" width="68" height="28" rx="12" fill="url(#cream)"/>
  <rect x="88" y="74" width="68" height="28" rx="12" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
  <ellipse cx="104" cy="82" rx="10" ry="7" fill="url(#shin)" opacity=".7"/>

  <!-- nose -->
  <rect x="114" y="78" width="16" height="10" rx="4" fill="url(#blackTip)"/>
  <rect x="114" y="78" width="16" height="10" rx="4" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="118" y="80" width="6" height="3" rx="1.5" fill="#fff" opacity=".85"/>

  <!-- eyes -->
  <rect x="92" y="58" width="12" height="14" rx="6" fill="url(#blackTip)"/>
  <rect x="92" y="58" width="12" height="14" rx="6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="140" y="58" width="12" height="14" rx="6" fill="url(#blackTip)"/>
  <rect x="140" y="58" width="12" height="14" rx="6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="95" cy="64" r="3" fill="#fff" opacity=".95"/>
  <circle cx="143" cy="64" r="3" fill="#fff" opacity=".95"/>

  <!-- whiskers -->
  <path d="M90 86 L60 82 M90 90 L58 90 M90 94 L62 98" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  <path d="M154 86 L184 82 M154 90 L186 90 M154 94 L182 98" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>

  <!-- paws highlight -->
  <ellipse cx="107" cy="156" rx="7" ry="3" fill="#fff" opacity=".5"/>
  <ellipse cx="137" cy="156" rx="7" ry="3" fill="#fff" opacity=".5"/>
</svg>